<style>
:root{--bg:#eee8dd;--card:#fff9ee;--surface:#fffdf8;--ink:#283a3b;--muted:#5c6866;--border:#dfd4c2;--accent:#8f572a;--accent-hover:#74441e;--accent-soft:#f3e5cf;--accent-ink:#4f2d11}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;margin:0}
.wrap{width:100%;max-width:min(1060px,max(700px,calc((100vh - 410px) * 1.7778)));margin:0 auto;padding:18px 20px 28px}
header{margin-bottom:12px}
.brand{font-size:13px;font-weight:600;letter-spacing:.08em;color:var(--accent);margin:0}
h1{font-size:clamp(26px,3.2vw,36px);line-height:1.18;margin:4px 0 6px}
.intro{max-width:none;margin:0;font-size:14.5px;letter-spacing:-.01em;word-break:keep-all;color:var(--muted)}
.stage{width:100%;background:#181a1a;border-radius:14px;overflow:hidden;box-shadow:0 12px 30px rgba(40,58,59,.10)}
video{display:block;width:100%;aspect-ratio:16/9;background:#000;cursor:pointer}
.stage-bar{display:flex;align-items:center;gap:12px;padding:7px 14px;background:#181a1a;color:#e7e0d4;font-size:13px}
#seek{flex:1;min-width:0;margin:0;padding:0;height:20px;accent-color:#c68a53;cursor:pointer}
#timecode{font-variant-numeric:tabular-nums;white-space:nowrap;color:#d6cdbf}
.stage-btn{min-height:30px;padding:4px 10px;margin:0;font-size:13px;background:rgba(255,249,238,.10);color:#f4ede0;border:1px solid rgba(255,249,238,.22);border-radius:7px;cursor:pointer}
.stage-btn:hover{background:rgba(255,249,238,.18)}
.panel{margin-top:12px;padding:14px 18px;background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:0 6px 22px rgba(40,58,59,.05)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.row+.row{margin-top:8px}
.ctrl-label{display:inline-flex;align-items:center;gap:8px;font-weight:500;color:var(--ink)}
.vol-wrap{display:inline-flex;align-items:center;gap:10px;white-space:nowrap;font-weight:500}
select,button,input{font:inherit}
select{min-height:38px;max-width:100%;padding:6px 12px;background:var(--surface);color:var(--ink);border:1px solid var(--border);border-radius:10px}
button{min-height:38px;padding:6px 14px;background:var(--surface);color:var(--ink);border:1px solid var(--border);border-radius:10px;cursor:pointer;transition:background .15s,border-color .15s,color .15s}
button:hover{background:#faf1e4;border-color:#b88961}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#play{background:var(--accent);color:var(--card);border-color:var(--accent);font-weight:600}
#play:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
button.is-active,#shuffle[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
#play.is-active{background:var(--accent-hover);color:var(--card);border-color:var(--accent-hover)}
#volume{width:min(170px,42vw);margin:0;padding:0;accent-color:var(--accent);cursor:pointer}
#queue{margin:0;font-size:14px;color:var(--muted)}
.scenes{margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.scenes p{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 7px}
.scenes-grid{display:flex;flex-wrap:wrap;gap:8px}
.meta{margin-top:10px;padding-top:8px;border-top:1px solid var(--border)}
#info{font-weight:600;margin:0;font-size:15px}
#status{font-size:13px;color:var(--muted);margin:2px 0 0}
.guide{font-size:13px;color:var(--muted);margin:12px 0 2px}
footer{margin:2px 0 0;font-size:13px;color:var(--muted)}
@media (max-width:640px){
  .wrap{max-width:100%;padding:18px 14px 32px}
  .intro{font-size:15px}
  .panel{padding:14px}
  select,button{min-height:44px;padding:8px 12px}
  .stage-btn{min-height:32px;padding:4px 10px}
  .ctrl-label{width:100%}
  .ctrl-label select{flex:1;min-width:0}
  .scenes-grid button{flex:1 1 calc(50% - 4px)}
}
</style>
</head>
<body>
<main class="wrap">
<header><p class="brand">키치링 × 레트로봇</p><h1>우리가 모르는 작은 이야기</h1><p class="intro">가방 끝에서 시작된 작은 만남이 공방과 풍경 속 이야기로 이어집니다. 키치링과 레트로봇의 하루를 음악과 함께 만나보세요.</p></header>
<div class="stage">
  <video id="film" aria-label="우리가 모르는 작은 이야기 영상" muted playsinline poster="poster.jpg" preload="metadata" src="media/film-1080p.mp4"></video>
  <div class="stage-bar">
    <input id="seek" aria-label="영상 재생 위치" type="range" min="0" max="177" step="0.1" value="0">
    <span id="timecode">0:00 / 2:57</span>
    <button id="fullscreen" class="stage-btn" type="button" aria-label="전체 화면">전체 화면</button>
  </div>
</div>
<section class="panel" aria-label="감상 설정">
  <div class="row">
    <label class="ctrl-label">음악 선택 <select id="track"></select></label>
    <button id="play" type="button">감상 시작</button>
    <button id="pause" type="button">일시정지</button>
    <button id="next" type="button">다음 곡</button>
  </div>
  <div class="row">
    <label class="ctrl-label">감상 목록 <select id="scope"><option value="all">전체 음악 17곡</option><option value="primary">추천 음악 6곡</option><option value="meong">멍함 분위기 9곡</option><option value="inst">가사 없는 음악 4곡</option></select></label>
    <button id="shuffle" type="button" aria-pressed="true">랜덤 연속 끄기</button>
    <label class="vol-wrap">음악 음량 <input id="volume" aria-label="음악 음량" type="range" min="0" max="1" step="0.05" value="0.5"></label>
  </div>
  <div class="row"><p id="queue" aria-live="polite"></p></div>
  <div class="scenes"><p>다시 보고 싶은 장면</p>
    <div class="scenes-grid">
      <button type="button" data-time="0">함께 걷는 길</button><button type="button" data-time="15">작은 만남</button><button type="button" data-time="21">공방의 하루</button><button type="button" data-time="97.5">황혼의 음악회</button><button type="button" data-time="137.5">호숫가의 밤</button><button type="button" data-time="172.5">함께한 순간</button>
    </div>
  </div>
  <div class="meta"><p id="info"></p><p id="status" role="status">음악을 준비하고 있어요.</p></div>
</section>
<audio id="music" preload="metadata"></audio>
<p class="guide">처음에 ‘감상 시작’을 눌러주세요. 영상이 끝나면 새로운 음악과 함께 이야기가 다시 시작됩니다.</p>
<footer>음악을 바꾸며 같은 장면의 다른 느낌을 만나보세요.</footer>
</main>
